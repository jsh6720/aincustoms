<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1160">
<title>아인관세 인사이트 — 카드뉴스 템플릿</title>
<link rel="stylesheet" href="./cards.css">
</head>
<body>
<main class="deck" id="deck"></main>

<script>
/* ===== Post data (example: topic 5). Schema: post-schema.md ===== */
window.POST = {
  category: "news",                       // case | hs | fta | news | req
  categoryLabel: "관세 뉴스",
  series: "아인관세 인사이트",
  writtenAt: "2026. 10.",
  cards: [
    { type: "cover",
      kicker: "2026. 1. 1. 시행 · 관세법 개정",
      watermark: "제42조의2",            // statute article or case number, outlined behind the title
      title: "품목분류 사전심사 후 수정신고하면 가산세 면제",
      refs: [ { label: "관세법", value: "제42조의2 제1항 제7호" }, { label: "시행", value: "2026. 1. 1." } ] },

    { type: "conclusion",
      tag: "결론 먼저",
      statement: "사전심사 결과를 받은 날부터 <em>2개월 안에</em> 수정신고하면 신고불성실 가산세 <em>10%</em>가 감면됩니다.",
      note: "줄어드는 것은 신고불성실 가산세입니다. 관세 본세와 납부지연 가산세는 그대로 내야 합니다.",
      impact: [ { k: "영향 대상", v: "품목분류 사전심사를 신청했거나 신청할 수입자" },
                { k: "기준일", v: "2026. 1. 1. 시행 (법률 제21208호)" } ] },

    { type: "facts",
      tag: "배경",
      lead: "분류가 애매한 물품을 먼저 신고하고 사전심사를 받으면, 그 사이 신고한 건은 가산세 위험이 남아 있었습니다.",
      rows: [ { k: "개정 법률", v: "법률 제21208호, 2025. 12. 23. 공포" },
              { k: "시행일", v: "<b>2026. 1. 1.</b>" },
              { k: "신설 조문", v: "관세법 제42조의2 제1항 제7호" },
              { k: "종전", v: "과세가격 사전심사(제37조)에만 같은 취지의 감면이 있었음" } ] },

    { type: "issue",
      tag: "쟁점과 근거",
      question: "어떤 신고분을, 언제까지 수정신고해야 감면될까?",
      text: "대상은 사전심사 신청 물품과 동일한 물품이고, 기한은 결과 통지일부터 2개월입니다.",
      statute: { name: "관세법 제42조의2 제1항 제7호",
                 meta: [ "시행 2026. 1. 1.", "법률 제21208호" ],
                 quote: "사전심사 결과의 통지를 받은 경우로서 … 통지된 품목분류를 적용하여 … 수정신고하는 경우: 제42조제1항제1호의 금액" } },

    { type: "compare",
      tag: "변경 전 · 후",
      mode: "change",                      // change (전/후) | parties (세관/수입자)
      a: { label: "변경 전", title: "감면 사유 없음",
           bullets: [ "사전심사 결과대로 수정신고해도 신고불성실 가산세 10%는 그대로" ] },
      b: { label: "변경 후 (2026. 1. 1.~)", title: "통지일부터 2개월 내 수정신고 시 10% 감면",
           bullets: [ "대상: 사전심사 신청일 ~ 통지 전날 신고납부한 세액", "조건: 통지된 품목분류를 적용해 수정신고" ] } },

    { type: "ruling",
      tag: "요지",
      seal: "시행 중",
      head: "면제되는 것과 아닌 것을 구분하세요",
      points: [ { yes: true,  text: "신고불성실 가산세 (부족세액의 10%)" },
                { yes: false, text: "납부지연 가산세 (이자 성격)" },
                { yes: false, text: "수정신고로 늘어난 관세 본세" } ],
      foot: { label: "감면 신청", value: "제42조의2 제2항, 대통령령 절차" } },

    { type: "checklist",
      tag: "실무 체크리스트",
      head: "우리 회사는 이렇게",
      items: [ { t: "통지서 수령일을 기록", d: "그날부터 2개월이 감면 기한. 넘기면 감면 불가." },
               { t: "대상 신고분을 한 번에 정리", d: "신청일부터 통지 전날까지 신고한 건을 목록화해 일괄 수정신고." },
               { t: "동일 물품인지 건별 확인", d: "통지된 분류와 다른 물품·기간 밖 신고분은 제외될 수 있음." } ],
      refs: [ { label: "관련 글", value: "합판 vs LVL 품목분류 (조심 2026관0002)" } ] },

    { type: "source",
      tag: "출처",
      sources: [ { kind: "법령", text: "<b>관세법 제42조의2 제1항 제7호</b> · 법률 제21208호 (2025. 12. 23. 공포) · <span class='date'>시행 2026. 1. 1.</span>" },
                 { kind: "법령", text: "<b>관세법 제86조</b> (품목분류 사전심사) · 현행 법률 제21490호, <span class='nowrap'>시행 2026. 10. 2.</span>" },
                 { kind: "원문", text: "원문: law.go.kr (국가법령정보센터) 등" } ],
      caveat: "개별 사안은 사실관계에 따라 달라질 수 있으며<br>이 카드는 법률 자문이 아닙니다.",
      cta: { title: "품목분류·가산세, 우리 건도 해당될까?", sub: "아인합동관세사무소에 문의하세요",
             site: "aincustoms.com", tel: "02-518-5435" } }
  ]
};

/* ===== Renderer (vanilla JS) ===== */
(function () {
  const P = window.POST;
  const N = P.cards.length;
  const ACCENT = { case: "var(--cat-case)", hs: "var(--cat-hs)", fta: "var(--cat-fta)", news: "var(--cat-news)", req: "var(--cat-req)", guide: "var(--cat-guide)" };
  const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const evi = r => `<span class="evi"><i class="dot"></i>${r.label ? esc(r.label) + " " : ""}<b>${esc(r.value)}</b></span>`;
  const eviRow = refs => refs && refs.length ? `<div class="evi-row">${refs.map(evi).join("")}</div>` : "";
  const tag = c => c.tag ? `<div class="tag">${esc(c.tag)}</div>` : "";
  const CHECK = `<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
  const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M5 13l7 7 7-7"/></svg>`;

  // Author shown only on the last (source) card; body.md carries it in the closing contact section. Office details stay as secondary contact.
  const AUTHOR = { name: "정석현", title: "대표관세사", mobile: "010-7906-5432", email: "jsh@aincustoms.com",
                   tel: "02-518-5435", site: "aincustoms.com" };

  const body = {
    cover: c => `
      ${c.watermark ? `<div class="cover-wm">${esc(c.watermark)}</div>` : ""}
      <div class="cover-kicker">${esc(c.kicker || "")}</div>
      <h1 class="cover-title">${esc(c.title)}</h1>
      <div class="cover-ref">${eviRow(c.refs)}</div>
      <div class="cover-office"><b>아인합동관세사무소</b><span>${AUTHOR.tel} · ${AUTHOR.site}</span></div>`,

    conclusion: c => `
      ${tag(c)}
      <div class="main"><p class="conclusion-stmt">${c.statement}</p>
      ${c.note ? `<p class="note">${esc(c.note)}</p>` : ""}</div>
      <dl class="impact">${(c.impact || []).map(i => `<dt>${esc(i.k)}</dt><dd>${esc(i.v)}</dd>`).join("")}</dl>`,

    facts: c => `
      ${tag(c)}
      <div class="main">${c.lead ? `<p class="text facts-lead">${esc(c.lead)}</p>` : ""}
      <ul class="kv">${(c.rows || []).map(r => `<li><span class="k">${esc(r.k)}</span><span class="v">${r.v}</span></li>`).join("")}</ul></div>`,

    issue: c => `
      ${tag(c)}
      <div class="main"><p class="issue-q">${esc(c.question)}</p>
      ${c.text ? `<p class="text">${esc(c.text)}</p>` : ""}</div>
      <div class="statute">
        <div class="st-name">${esc(c.statute.name)}</div>
        <div class="st-meta">${(c.statute.meta || []).map(m => `<span>${esc(m)}</span>`).join("")}</div>
        ${c.statute.quote ? `<blockquote>${esc(c.statute.quote)}</blockquote>` : ""}
      </div>`,

    compare: c => {
      const side = (s, cls) => `
        <div class="cmp-side ${cls}">
          <div class="cmp-label">${esc(s.label)}</div>
          <div class="cmp-title">${esc(s.title)}</div>
          <ul>${(s.bullets || []).map(b => `<li>${esc(b)}</li>`).join("")}</ul>
        </div>`;
      const join = c.mode === "parties" ? `<div class="cmp-join">vs</div>` : `<div class="cmp-join">${ARROW}</div>`;
      return `${tag(c)}<div class="main"><div class="cmp">${side(c.a, "a")}${join}${side(c.b, "b")}</div></div>`;
    },

    ruling: c => `
      ${tag(c)}
      <div class="seal ${c.seal.length > 2 ? "long" : ""}">${esc(c.seal)}</div>
      <div class="main"><h1 class="ruling-head">${esc(c.head)}</h1>
      <ul class="ruling-points">${(c.points || []).map((p, i) =>
        `<li class="${p.yes ? "yes" : "no"}"><span class="n">${p.yes ? "○" : "×"}</span><span>${esc(p.text)}</span></li>`).join("")}</ul></div>
      ${c.foot ? `<div class="ruling-foot">${evi(c.foot)}</div>` : ""}`,

    checklist: c => `
      ${tag(c)}
      <div class="main">${c.head ? `<h1 class="head" style="margin-bottom:40px">${esc(c.head)}</h1>` : ""}
      <ul class="check">${(c.items || []).map(i => `
        <li><span class="box">${CHECK}</span><div><div class="ct">${esc(i.t)}</div>${i.d ? `<div class="cd">${esc(i.d)}</div>` : ""}</div></li>`).join("")}</ul></div>
      ${c.refs ? `<div class="check-foot">${eviRow(c.refs)}</div>` : ""}`,

    steps: c => `
      ${tag(c)}
      <div class="main">${c.head ? `<h1 class="head" style="margin-bottom:44px">${esc(c.head)}</h1>` : ""}
      <ol class="steps">${(c.steps || []).map((s, i) => `
        <li><span class="sn">${i + 1}</span><div><div class="st">${esc(s.t)}</div>${s.d ? `<div class="sd">${esc(s.d)}</div>` : ""}</div></li>`).join("")}</ol></div>
      ${c.refs ? `<div class="check-foot">${eviRow(c.refs)}</div>` : ""}`,

    source: c => `
      ${tag(c)}
      <div class="src">
        <div class="src-block"><h3>근거</h3><ul>${(c.sources || []).map(s =>
          `<li class="${s.kind === "원문" ? "origin" : ""}">${s.text}</li>`).join("")}</ul></div>
        ${c.caveat ? `<p class="disclaimer">${c.caveat} <span class="nowrap">(작성 ${esc(P.writtenAt)})</span></p>` : ""}
      </div>
      <div class="cta">
        <div class="cta-title">${esc(c.cta.title)}</div><div class="cta-sub">${esc(c.cta.sub)}</div>
        <div class="cta-author">
          <div class="who"><b>${AUTHOR.name}</b>${AUTHOR.title}</div>
          <div class="contacts">
            <span><i>M</i>${AUTHOR.mobile}</span><span><i>E</i>${AUTHOR.email}</span>
            <span><i>T</i>${AUTHOR.tel} · ${AUTHOR.site}</span>
          </div>
        </div>
      </div>`
  };

  const DARK = { cover: true, ruling: true };
  const TINT = { issue: true, source: true };

  document.getElementById("deck").innerHTML = P.cards.map((c, i) => `
    <section class="card ${DARK[c.type] ? "dark" : ""} ${TINT[c.type] ? "tint" : ""}" data-type="${c.type}" style="--accent:${ACCENT[P.category] || "var(--blue)"}">
      <i class="mark tl"></i><i class="mark tr"></i><i class="mark bl"></i><i class="mark br"></i>
      <header class="chrome-top"><span class="chip">${esc(P.categoryLabel)}</span><span class="series">${esc(P.series)}</span></header>
      <div class="body">${body[c.type](c)}</div>
      <footer class="chrome-bottom"><img class="logo" src="./logo.png" alt="Ain Customs"><span class="page">${i + 1} / ${N}</span></footer>
    </section>`).join("");

  // Shrink each cover watermark until it fits the left 720px (clear of Naver's thumbnail badge).
  const fitWatermarks = () => document.querySelectorAll(".cover-wm").forEach(el => {
    for (let size = 120; size >= 56 && el.getBoundingClientRect().width > 720; size -= 4) el.style.fontSize = size + "px";
  });
  fitWatermarks();
  document.fonts.ready.then(fitWatermarks);
})();
</script>
</body>
</html>
